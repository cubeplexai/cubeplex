# Development Configuration
dynaconf_merge: true
development:
  env: development

  debug: true

  api:
    reload: true

  # Local dev infra defaults (base config.yaml ships these neutral). Override
  # per-machine in config.development.local.yaml.
  database:
    user: "postgres"
    password: "postgres"
  redis:
    url: "redis://:passwd@localhost:6379/0"

  # Preserve in-flight agent work during Ctrl-C and reload. HTTP and permanent
  # SSE streams have a separate short shutdown deadline under api config.
  lifecycle:
    graceful_drain_timeout_seconds: 3600

  # Sandbox Configuration for Development
  sandbox:
    enabled: true
    domain: "localhost:8090"
    image: "hub.sensedeal.vip/library/cubeplex-sandbox:24.04-20260718"

  # Auth (development overrides)
  auth:
    cookie_secure: false
    password_policy: "high"
    email_verification:
      enabled: "auto"
      code_length: 6
      code_ttl_seconds: 600
      max_attempts: 5
      resend_cooldown_seconds: 60
      rate_limit_per_hour: 10

  # File parsers: local docling-serve (developer runs `docker compose up docling-serve`)
  parsers:
    docling_serve:
      base_url: "http://localhost:5001"

  # Permit private and plain-HTTP MCP endpoints used by local development services.
  mcp:
    outbound_policy: "unrestricted"
    allowed_schemes: ["http"]  # merged with the base HTTPS scheme

  # Tracing on by default in dev so local runs emit trace files.
  # To also ship spans to Grafana Tempo, set `tracing.otlp.endpoint` in
  # config.development.local.yaml (per-machine, not checked in).
  tracing:
    enabled: true
    record_content: true
