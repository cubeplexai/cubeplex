{{- if .Values.backend.lifecycleMaintenance.enabled }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "cubeplex.backend.fullname" . }}-lifecycle-maintenance
  labels:
    {{- include "cubeplex.labels" . | nindent 4 }}
    app.kubernetes.io/component: backend-maintenance
  annotations:
    "helm.sh/hook": pre-upgrade
    "helm.sh/hook-weight": "-5"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  backoffLimit: 0
  activeDeadlineSeconds: {{ .Values.backend.lifecycleMaintenance.activeDeadlineSeconds }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "cubeplex.name" . }}
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: backend-maintenance
    spec:
      restartPolicy: Never
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: lifecycle-maintenance
          image: {{ include "cubeplex.backend.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command:
            - python
            - -m
            - cubeplex.scripts.lifecycle_upgrade
            - --maintenance
          env:
            {{- range $k, $v := .Values.backend.env }}
            - name: {{ $k }}
              value: {{ $v | quote }}
            {{- end }}
          volumeMounts:
            - name: config
              mountPath: /app/config.production.local.yaml
              subPath: config.production.local.yaml
            - name: secrets
              mountPath: /app/config.production.secrets.yaml
              subPath: config.production.secrets.yaml
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: {{ include "cubeplex.backend.fullname" . }}-config
        - name: secrets
          secret:
            secretName: {{ include "cubeplex.backend.fullname" . }}-secrets
{{- end }}
