{{- if .Values.ingress.enabled -}}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "cubeplex.fullname" . }}
  labels:
    {{- include "cubeplex.labels" . | nindent 4 }}
  {{- with .Values.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  {{- if .Values.ingress.tls.enabled }}
  tls:
    - hosts:
        - {{ .Values.ingress.host | quote }}
      secretName: {{ printf "%s-tls" (include "cubeplex.fullname" .) }}
  {{- end }}
  rules:
    - host: {{ .Values.ingress.host | quote }}
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: {{ include "cubeplex.backend.fullname" . }}
                port:
                  number: {{ .Values.backend.service.port }}
          - path: /health
            pathType: Prefix
            backend:
              service:
                name: {{ include "cubeplex.backend.fullname" . }}
                port:
                  number: {{ .Values.backend.service.port }}
          # Sandbox browser/terminal panels: the panel URL is rooted at
          # api.public_url (this ingress host) and reverse-proxies HTTP + WebSocket
          # to opensandbox-server. It's served by the backend at root (not /api),
          # so it needs its own path — otherwise it falls through to the frontend
          # and 404s. ingress-nginx forwards the WS Upgrade on this path by default.
          - path: /sandbox-panel
            pathType: Prefix
            backend:
              service:
                name: {{ include "cubeplex.backend.fullname" . }}
                port:
                  number: {{ .Values.backend.service.port }}
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "cubeplex.frontend.fullname" . }}
                port:
                  number: {{ .Values.frontend.service.port }}
{{- end }}
