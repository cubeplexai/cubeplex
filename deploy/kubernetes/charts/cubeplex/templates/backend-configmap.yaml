{{- $pgHost := include "cubeplex.postgresql.host" . -}}
{{- $redisHost := include "cubeplex.redis.host" . -}}
{{- $rustfsHost := include "cubeplex.rustfs.host" . -}}
{{- $doclingHost := include "cubeplex.docling.host" . -}}
{{- $tempoHost := include "cubeplex.tempo.host" . -}}
{{- $overrides := .Values.backend.configOverrides | default dict -}}
{{- if .Values.tempo.enabled -}}
{{- $overrides = omit $overrides "tracing" -}}
{{- end -}}
{{- $sandboxCfg := .Values.backend.sandbox | default dict -}}
{{- $sandboxProvider := (dig "provider" "opensandbox" $sandboxCfg) | default "opensandbox" -}}
{{- $cubepodCfg := (dig "cubepod" dict $sandboxCfg) | default dict -}}
{{- $cubepodBaseUrl := dig "base_url" "" $cubepodCfg -}}
{{- $cubepodDefaultTemplate := dig "default_template" "" $cubepodCfg -}}
{{- $cubepodWarmPool := dig "warm_pool" "" $cubepodCfg -}}
{{- if eq $sandboxProvider "cubepod" -}}
{{- $_ := required "backend.sandbox.cubepod.base_url must be set in values.local.yaml when backend.sandbox.provider is cubepod" $cubepodBaseUrl -}}
{{- $_ := required "backend.sandbox.cubepod.default_template must not be empty when backend.sandbox.provider is cubepod" $cubepodDefaultTemplate -}}
{{- end -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "cubeplex.backend.fullname" . }}-config
  labels:
    {{- include "cubeplex.labels" . | nindent 4 }}
data:
  config.production.local.yaml: |
    dynaconf_merge: true
    production:
      {{- with $overrides }}
      {{- toYaml . | nindent 6 }}
      {{- end }}
      database:
        host: {{ $pgHost | quote }}
        port: 5432
        user: {{ .Values.postgres.auth.username | quote }}
        name: {{ .Values.postgres.auth.database | quote }}
      objectstore:
        provider: "s3"
        endpoint: {{ printf "http://%s:9000" $rustfsHost | quote }}
        bucket: {{ .Values.rustfs.defaultBucket | quote }}
        region: "us-east-1"
      sandbox:
        # Sandbox execution is required (default: opensandbox; supports cubepod / local).
        enabled: true
        provider: {{ $sandboxProvider | quote }}
        use_server_proxy: {{ dig "sandbox" "use_server_proxy" false .Values.backend }}
        # Panels flow through cubeplex's token-authed panel reverse proxy (not the
        # OpenSandbox ingress gateway), so signed secured-endpoint mode is off.
        secure_access: {{ dig "sandbox" "secure_access" false .Values.backend }}
        {{- if or (eq $sandboxProvider "cubepod") $cubepodBaseUrl $cubepodWarmPool (and $cubepodDefaultTemplate (ne $cubepodDefaultTemplate "cubeplex-ubuntu24-desktop")) }}
        cubepod:
          {{- if $cubepodBaseUrl }}
          base_url: {{ $cubepodBaseUrl | quote }}
          {{- end }}
          {{- if $cubepodDefaultTemplate }}
          default_template: {{ $cubepodDefaultTemplate | quote }}
          {{- end }}
          {{- if $cubepodWarmPool }}
          warm_pool: {{ $cubepodWarmPool | quote }}
          {{- end }}
        {{- end }}
        {{- if .Values.egress.enabled }}
        # Activates egress secret-injection in SandboxManager (every
        # injection call is gated on `if self._exchange_host:`) and is
        # force-allowed in the sandbox's egress network policy. Defaults to
        # the same host the sandbox-side mitmproxy addon actually connects to
        # (see egress-webhook-deployment.yaml's exchangeURL default).
        egress_exchange_host: {{ dig "sandbox" "egress_exchange_host" (printf "%s.%s.svc.cluster.local" (include "cubeplex.backend.fullname" .) .Release.Namespace) .Values.backend }}
        {{- end }}
      {{- if .Values.docling.enabled }}
      parsers:
        docling_serve:
          base_url: {{ printf "http://%s:%v" $doclingHost .Values.docling.service.port | quote }}
      {{- end }}
      {{- if .Values.tempo.enabled }}
      tracing:
        enabled: true
        record_content: {{ .Values.tempo.recordContent }}
        jsonl:
          enabled: false
        otlp:
          endpoint: {{ printf "http://%s:4318/v1/traces" $tempoHost | quote }}
        tempo:
          query_endpoint: {{ printf "http://%s:3200" $tempoHost | quote }}
      {{- end }}
      {{- if .Values.egress.enabled }}
      egress_exchange:
        auth:
          mode: mtls
        listener:
          enabled: true
          host: "0.0.0.0"
          port: 8443
          certfile: "/etc/egress-mtls/tls.crt"
          keyfile:  "/etc/egress-mtls/tls.key"
          ca_certs: "/etc/egress-mtls/ca.crt"
      {{- end }}
