<style id="cubeplex-clipboard-close">.clipboard .cubeplex-clipboard-close{position:absolute;top:2px;right:4px;z-index:2;width:22px;height:22px;border:0;border-radius:4px;background:transparent;color:#dcddde;font:700 16px/22px Whitney,Helvetica,Arial,sans-serif;cursor:pointer;opacity:.85}.clipboard .cubeplex-clipboard-close:hover{opacity:1;background:rgba(0,0,0,.25)}.clipboard textarea{padding-right:28px;box-sizing:border-box}</style><script id="cubeplex-clipboard-close">(function(){function closeClipboard(){if(document.querySelector(".clipboard"))document.body.click()}function ensureClose(panel){if(!panel||panel.querySelector(".cubeplex-clipboard-close"))return;var btn=document.createElement("button");btn.type="button";btn.className="cubeplex-clipboard-close";btn.setAttribute("aria-label","Close clipboard");btn.title="Close";btn.textContent="\u00d7";btn.addEventListener("click",function(e){e.preventDefault();e.stopPropagation();closeClipboard()});panel.appendChild(btn)}function scan(){document.querySelectorAll(".clipboard").forEach(ensureClose)}document.addEventListener("keydown",function(e){if(e.key==="Escape"&&document.querySelector(".clipboard")){e.preventDefault();closeClipboard()}},true);var obs=new MutationObserver(scan);if(document.body){obs.observe(document.body,{childList:true,subtree:true});scan()}else{document.addEventListener("DOMContentLoaded",function(){obs.observe(document.body,{childList:true,subtree:true});scan()})}})();</script>
